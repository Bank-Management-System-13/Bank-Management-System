name: C++ Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build Sprint 1
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic main.cpp -o bank_management_system

      - name: Build Sprint 2
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -ISprint2/include Sprint2/src/*.cpp -o bank_management_system_sprint2

