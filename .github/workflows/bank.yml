name: C++ Build and Test

on:
  push:
    branches: [main, feature/tests-audit-reports, feature/fixed-deposit, feature/increase-test-coverage]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gcovr

      - name: Build Sprint 1
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic main.cpp -o bank_management_system

      - name: Build Sprint 2 application
        run: |
          cd Sprint2
          g++ -std=c++17 -Wall -Wextra -pedantic -Iinclude src/*.cpp -o bank_management_system

      - name: Build automated tests with coverage instrumentation
        run: |
          cd Sprint2
          mkdir -p test-runtime
          g++ -std=c++17 -Wall -Wextra -pedantic --coverage -Iinclude -Itests \
            tests/test_main.cpp tests/test_audit.cpp tests/test_storage.cpp \
            tests/test_reports.cpp tests/test_security.cpp tests/test_admin.cpp \
            tests/test_fixed_deposit.cpp tests/test_fixed_deposit_workflows.cpp \
            tests/test_auth.cpp tests/test_storage_edges.cpp \
            src/audit.cpp src/storage.cpp src/reports.cpp src/security.cpp src/admin.cpp src/fixed_deposit.cpp src/auth.cpp \
            -o test-runtime/tests

      - name: Run automated tests in isolated working directory
        run: |
          cd Sprint2/test-runtime
          ./tests

      - name: Generate coverage summary
        run: |
          cd Sprint2
          gcovr --root . --filter 'src/.*' --exclude-throw-branches --exclude-unreachable-branches --decisions --html-details coverage.html --print-summary --fail-under-line 80 --fail-under-decision 80

      - name: Upload detailed coverage report
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-coverage-report
          path: Sprint2/coverage*
          if-no-files-found: error
